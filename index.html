<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рулетка БЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            color: #ffd700;
        }

        /* Контейнер колеса */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 20px;
        }

        /* Само колесо */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            /* Градиент для секторов */
            background: conic-gradient(
                #ff4757 0deg 45deg,
                #ffa502 45deg 90deg,
                #2ed573 90deg 135deg,
                #1e90ff 135deg 180deg,
                #a55eea 180deg 225deg,
                #70a1ff 225deg 270deg,
                #2f3542 270deg 315deg,
                #f1c40f 315deg 360deg
            );
            /* ВАЖНО: именно здесь происходит анимация */
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            transform-origin: center center;
        }

        /* Стрелка-указатель */
        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        /* Кнопка */
        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Поле результата */
        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-height: 30px; /* Чтобы блок не схлопывался */
        }
    </style>
</head>
<body>

    <h2>🎰 Колесо удачи</h2>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div id="wheel"></div>
    </div>

    <button id="spinBtn">КРУТИТЬ!</button>
    <div id="result">Жми кнопку!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const prizes = ['Лиман', 'Масляковка', 'Саяны', 'Эльбрус', 'Култук', 'Отпуск', 'Тыл', 'Выходной'];
        const wheel = document.getElementById('wheel');
        const btn = document.getElementById('spinBtn');
        const resultText = document.getElementById('result');

        btn.addEventListener('click', () => {
            btn.disabled = true;
            resultText.innerText = 'Колесо крутится...';
            resultText.style.color = '#aaa';

            // Генерируем случайное количество градусов (минимум 1080 градусов = 3 полных оборота)
            const randomDegrees = Math.floor(Math.random() * 3600) + 1080;
            
            // Применяем вращение
            wheel.style.transform = `rotate(\${randomDegrees}deg)`;

            // Через 4 секунды (время анимации) показываем приз
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * prizes.length);
                const selectedPrize = prizes[randomIndex];
                
                resultText.innerText = `🎉 Выпало: \${selectedPrize}`;
                resultText.style.color = '#ffd700';
                
                btn.disabled = false;
            }, 4000);
        });
    </script>
</body>
</html>
