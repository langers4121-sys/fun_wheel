<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рулетка БЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 20px;
            overflow: hidden; /* Обрезаем всё, что вылезает за круг */
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #wheel {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            /* ВАЖНО: origin должен быть строго по центру */
            transform-origin: center center;
            /* Плавное вращение */
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            /* Создаем колесо из секторов */
            background-image: 
                linear-gradient(45deg, #ff4757 50%, transparent 50%),
                linear-gradient(-45deg, #ffa502 50%, transparent 50%),
                linear-gradient(135deg, #2ed573 50%, transparent 50%),
                linear-gradient(-135deg, #1e90ff 50%, transparent 50%),
                linear-gradient(225deg, #a55eea 50%, transparent 50%),
                linear-gradient(-225deg, #70a1ff 50%, transparent 50%),
                linear-gradient(315deg, #2f3542 50%, transparent 50%),
                linear-gradient(-315deg, #f1c40f 50%, transparent 50%);
        }

        .pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
        }

        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <h2>🎰 Колесо удачи</h2>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div id="wheel"></div>
    </div>

    <button id="spinBtn">КРУТИТЬ!</button>
    <div id="result">Жми кнопку!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const prizes = ['Лиман', 'Масляковка', 'Саяны', 'Эльбрус', 'Култук', 'Отпуск', 'Тыл', 'Выходной'];
        const wheel = document.getElementById('wheel');
        const btn = document.getElementById('spinBtn');
        const resultText = document.getElementById('result');

        btn.addEventListener('click', () => {
            btn.disabled = true;
            resultText.innerText = 'Колесо крутится...';
            resultText.style.color = '#aaa';

            // Генерируем случайное количество градусов (минимум 3 полных оборота + случайный остаток)
            const randomDegrees = Math.floor(Math.random() * 3600) + 1080;
            
            // Применяем вращение
            wheel.style.transform = `rotate(\${randomDegrees}deg)`;

            // Через 4 секунды (время анимации) показываем приз
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * prizes.length);
                const selectedPrize = prizes[randomIndex];
                
                resultText.innerText = `🎉 Выпало: \${selectedPrize}`;
                resultText.style.color = '#ffd700';
                
                btn.disabled = false;
            }, 4000);
        });
    </script>
</body>
</html>
